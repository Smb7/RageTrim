[package]
name = "ragetrim"
version = "0.1.0"
description = "Browse local clips and mark what you have already watched."
authors = ["Shane"]
edition = "2024"

[lib]
name = "ragetrim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
dunce = "1"
thiserror = "2"
dirs = "6"
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["blocking", "multipart", "json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
